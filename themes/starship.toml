# starship.toml — the prompt, written in roles. `theme use` renders it.
#
# The distro owns starship's configuration: conf/prompt.nu points
# STARSHIP_CONFIG at the RENDERED copy, <your dir>/.state/theme/starship.toml,
# which is this file with `[palettes.distro]` replaced by the theme's resolved
# roles. Until `theme use` has run this file is used as it is, and the block at
# the bottom is the ANSI tier (themes/palettes/ansi.nuon in starship's own
# spellings), so the prompt follows the terminal's sixteen colours from the
# first start.
#
# The colours in the styles are ROLES — tint_red, tint_orange, tint_yellow,
# tint_green, tint_teal, tint_accent_alt with on_tint written on them, text_*
# for the symbols — plus the sixteen by name; docs/concepts/theming.md lists
# them all. A theme that ships a peach gets a peach for `orange` and one that
# does not gets a blend of its red and yellow. The tints are the hues
# themselves on a dark theme and pastels of them on a light one, where a
# saturated bar with light text on it was the loudest thing on the screen.
# Never write a hex here.
#
# To change the prompt, copy this file to <your dir>/themes/starship.toml and
# `theme sync`: yours is rendered instead. Keep `palette = 'distro'` and stick
# to roles, and every theme keeps fitting it.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](tint_red)\
$os\
$username\
[](bg:tint_orange fg:tint_red)\
$directory\
[](bg:tint_yellow fg:tint_orange)\
$git_branch\
$git_status\
[](fg:tint_yellow bg:tint_green)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:tint_green bg:tint_teal)\
$conda\
[](fg:tint_teal bg:tint_accent_alt)\
$time\
[ ](fg:tint_accent_alt)\
$cmd_duration\
$line_break$character"""

palette = 'distro'

[os]
disabled = false
style = "bg:tint_red fg:on_tint"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:tint_red fg:on_tint"
style_root = "bg:tint_red fg:on_tint"
format = '[ $user]($style)'

[directory]
style = "bg:tint_orange fg:on_tint"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:tint_yellow"
format = '[[ $symbol $branch ](fg:on_tint bg:tint_yellow)]($style)'

[git_status]
style = "bg:tint_yellow"
format = '[[($all_status$ahead_behind )](fg:on_tint bg:tint_yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:tint_green"
format = '[[ $symbol( $version) ](fg:on_tint bg:tint_green)]($style)'

[c]
symbol = " "
style = "bg:tint_green"
format = '[[ $symbol( $version) ](fg:on_tint bg:tint_green)]($style)'

[rust]
symbol = ""
style = "bg:tint_green"
format = '[[ $symbol( $version) ](fg:on_tint bg:tint_green)]($style)'

[golang]
symbol = ""
style = "bg:tint_green"
format = '[[ $symbol( $version) ](fg:on_tint bg:tint_green)]($style)'

[php]
symbol = ""
style = "bg:tint_green"
format = '[[ $symbol( $version) ](fg:on_tint bg:tint_green)]($style)'

[java]
symbol = " "
style = "bg:tint_green"
format = '[[ $symbol( $version) ](fg:on_tint bg:tint_green)]($style)'

[kotlin]
symbol = ""
style = "bg:tint_green"
format = '[[ $symbol( $version) ](fg:on_tint bg:tint_green)]($style)'

[haskell]
symbol = ""
style = "bg:tint_green"
format = '[[ $symbol( $version) ](fg:on_tint bg:tint_green)]($style)'

[python]
symbol = ""
style = "bg:tint_green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:on_tint bg:tint_green)]($style)'

[docker_context]
symbol = ""
style = "bg:tint_teal"
format = '[[ $symbol( $context) ](fg:on_tint bg:tint_teal)]($style)'

[conda]
symbol = "  "
style = "fg:on_tint bg:tint_teal"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:tint_accent_alt"
format = '[[  $time ](fg:on_tint bg:tint_accent_alt)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:text_green)'
error_symbol = '[](bold fg:text_red)'
vimcmd_symbol = '[❮](bold fg:text_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:text_accent_alt)'
vimcmd_replace_symbol = '[❮](bold fg:text_accent_alt)'
vimcmd_visual_symbol = '[❮](bold fg:text_yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:tint_accent_alt"
disabled = false
show_notifications = false
min_time_to_notify = 45000


# ── the ANSI tier; `theme use` replaces this block ────────────────────────────
