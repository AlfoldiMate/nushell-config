# ci — prove the claim "macOS, Linux and Windows" on all three, every push.
#
# The distro is a live shell configuration: a parse error breaks every new
# terminal, and it breaks it on whichever platform was not the one it was
# written on. So the matrix runs the real installer and then loads the config
# for real — `nu -c` deliberately loads no config and would prove nothing.
#
# What this does NOT cover, and it is most of the interesting part: Ghostty is
# not installed on any runner, so the theme picker, the font installer and the
# terminal registry are exercised only to the point of reporting "not
# installed". docs/reference/platforms.md says which platforms those have actually been run
# on. A green matrix here means the configuration parses, installs and loads.

name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Git Bash on the Windows runner, so the same quoting works everywhere.
    shell: bash

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: hustcer/setup-nu@v3
        with:
          # The version this distro is verified against. Nushell makes breaking
          # changes at minor versions, so this is pinned deliberately: when it
          # is raised, the config is what has to be checked, not the pin.
          version: '0.115.1'

      - name: nu is here
        run: nu --version

      # install.nu takes every default by itself when there is no terminal on
      # stdin and stdout, so --defaults is belt and braces. Plugins are skipped:
      # the runner's nu has no plugin binaries beside it to register. The
      # terminal too: --defaults would brew-install Ghostty on the macOS runner.
      - name: install
        run: nu install.nu --defaults --skip-plugins --skip-terminal

      - name: the split happened
        run: |
          nu -l -c 'let s = (nu-config install-status); print $s; if $s.state != "split" { error make { msg: $"layout is ($s.state), not split" } }'

      - name: parse
        run: |
          nu -l -c 'if (nu-check distro.nu) { print "distro.nu and everything it sources parse" } else { error make { msg: "distro.nu does not parse" } }'

      # The one check that covers a LAZY module: nothing else parses them,
      # because they are sourced by a runtime hook rather than by `source`.
      - name: module contract
        run: |
          nu -l -c 'let p = (nu-config module lint); print $p; if ($p | is-not-empty) { error make { msg: "module lint failed" } }'

      - name: doctor
        run: nu -l -c 'nu-config doctor'

      # The suite. Every shell it starts has a config directory of its own
      # under the run's scratch directory, so it neither needs nor touches the
      # one the installer wrote above; docs/reference/tests.md.
      - name: tests
        run: nu tests/run.nu --timing

      # A default install must leave no override behind; that is the test that
      # the defaults/settings layering works, and it is cheap to keep honest.
      - name: no overrides after a default install
        run: |
          nu -l -c 'let k = (nu-config knobs --overridden); print $k; if ($k | is-not-empty) { error make { msg: "a default install wrote overrides" } }'

      # The scaffold the installer wrote, and its three examples: complete and
      # working, inert only by name. Renamed, the drop-in has to parse and
      # bind its key, `hello` has to answer three slots, the palette has to
      # resolve at tier three. `source` and `use` are parse-time, so the
      # copies are made in one shell and checked in the next.
      - name: the scaffold is complete and the examples work once renamed
        run: |
          nu -l -c 'let s = (nu-config user status); print $s; if ($s | where state != present | is-not-empty) { error make { msg: "the scaffold is not as written" } }'
          nu -l -c '
            cd (nu-config user-root)
            cp autoload/example.nu.off autoload/example.nu
            cp completions/hello.nu.off completions/hello.nu
            cp themes/palettes/example.nuon.off themes/palettes/example.nuon
          '
          nu -l -c '
            const u = ($nu.config-path | path dirname)
            source ($u | path join autoload example.nu)
            if (which gs | is-empty) { error make { msg: "the drop-in did not define its alias" } }
            if ($env.config.keybindings | where name == clear_screen_example | is-empty) { error make { msg: "the drop-in did not bind its key" } }
            use hello.nu *
            let subs = ("hello " | commandline complete)
            let lang = ("hello greet --lang " | commandline complete)
            print { subcommands: $subs, lang: $lang }
            # `in`, not `==`: the drop-in just sourced turned fuzzy matching on, and
            # the command matching of Nushell itself then adds `nu-complete hello spec`.
            # (No apostrophe in this comment: bash reads the whole script as one
            # single-quoted string.)
            if not ([greet wave] | all {|x| $x in $subs }) or $lang != [en fr de] { error make { msg: "hello.nu does not complete its slots" } }
            use terminal *
            let t = (theme resolve Example | select name by tier)
            print $t
            if $t.tier != "palette" { error make { msg: "example.nuon did not resolve as a palette" } }
          '

      - name: bootstrap/install.sh parses
        run: sh -n bootstrap/install.sh

      - name: bootstrap/install.ps1 parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path bootstrap/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "install.ps1 parses"
